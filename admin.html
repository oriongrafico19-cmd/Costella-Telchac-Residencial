<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costella · Configuración</title><link rel="stylesheet" href="style.css"></head><body class="section-cream"><main class="wrap" style="padding:60px 0;max-width:760px"><p class="eyebrow ink">ADMINISTRACIÓN LOCAL</p><h1 style="font-size:56px">Configura la experiencia Costella.</h1><p style="color:var(--muted)">Aquí puedes preparar el enlace de agenda y el endpoint opcional de leads. La landing solo muestra el botón de videollamada cuando el perfil resulta compatible.</p><div style="background:var(--paper);padding:30px;margin-top:30px;border:1px solid var(--line);border-radius:12px;display:grid;gap:14px"><label>Booking / calendario<input id="booking" style="width:100%;padding:12px;margin-top:6px" value="https://calendly.com/somosamco/30min" placeholder="https://..." /></label><label>Lead endpoint<input id="lead" style="width:100%;padding:12px;margin-top:6px" placeholder="https://..." /></label><button id="save" class="cta cta-primary" style="width:max-content">Descargar config.js</button><a class="text-link" href="/">Volver a Costella</a></div></main><script>const q=id=>document.getElementById(id);q('save').onclick=()=>{const c=`window.COSTELLA_CONFIG = {
  bookingUrl: ${JSON.stringify(q('booking').value.trim())},
  leadEndpoint: ${JSON.stringify(q('lead').value.trim())},
  metaPixelId: ''
};
`;const b=new Blob([c],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='config.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}</script></body></html>
