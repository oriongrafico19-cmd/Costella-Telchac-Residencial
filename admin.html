<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costella · Administrador</title><style>body{font-family:Arial,sans-serif;background:#0b1d28;color:#f1eed6;margin:0;padding:40px}.wrap{max-width:820px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:400}.card{background:#f1eed6;color:#18232d;padding:28px;margin-top:18px}.grid{display:grid;gap:14px}.grid label{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.grid input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px}.btn{padding:13px 18px;border:0;background:#c99f53;color:#10202a;font-weight:700;cursor:pointer}.note{font-size:12px;line-height:1.6;color:#666}.ok{color:#386d3b}.warning{background:#efe1c4;color:#6b4e12;padding:12px;margin:15px 0;font-size:13px}</style></head><body><div class="wrap"><h1>Costella · Administrador</h1><p>Configura aquí los enlaces de conversión de la landing.</p><div class="warning">Este panel genera un <code>config.js</code> para publicar. Los cambios guardados en el navegador no modifican por sí mismos el sitio público.</div><div class="card"><div class="grid"><label>Booking / calendario del asesor<input id="booking"></label><label>Webinar<input id="webinar"></label><label>Lead endpoint<input id="lead"></label><label>Meta Pixel ID<input id="pixel"></label><label>Cupos reales del webinar<input id="slots" type="number" min="0" value="10"></label></div><p style="margin-top:18px"><label><input type="checkbox" id="scarcity"> Mostrar urgencia de cupo</label></p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn" id="save">Guardar en este navegador</button><button class="btn" id="download">Descargar config.js</button><a class="btn" href="/" style="text-decoration:none">Ver landing</a></div><p id="status" class="note"></p></div><script>const cfg=()=>({bookingUrl:document.querySelector('#booking').value.trim(),webinarUrl:document.querySelector('#webinar').value.trim(),leadEndpoint:document.querySelector('#lead').value.trim(),metaPixelId:document.querySelector('#pixel').value.trim(),webinarSlots:Number(document.querySelector('#slots').value||0),showWebinarScarcity:document.querySelector('#scarcity').checked,qualificationReferenceDownPayment:80000});function load(){try{const c=JSON.parse(localStorage.getItem('costella_config')||'{}');for(const [k,v] of Object.entries(c)){const e=document.querySelector('#'+({bookingUrl:'booking',webinarUrl:'webinar',leadEndpoint:'lead',metaPixelId:'pixel',webinarSlots:'slots',showWebinarScarcity:'scarcity'}[k]||''));if(e){e.type==='checkbox'?e.checked=!!v:e.value=v}}}catch(e){}}document.querySelector('#save').onclick=()=>{localStorage.setItem('costella_config',JSON.stringify(cfg()));document.querySelector('#status').textContent='Guardado en este navegador.'};document.querySelector('#download').onclick=()=>{const c=cfg();const text='const COSTELLA_CONFIG = '+JSON.stringify(c,null,2)+';\n';const blob=new Blob([text],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.js';a.click();URL.revokeObjectURL(a.href);document.querySelector('#status').textContent='config.js generado.'};load();</script></div></body></html>
