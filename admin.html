<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costella · Configuración</title><link rel="stylesheet" href="style.css"></head><body class="section-cream"><main class="wrap" style="padding:60px 0;max-width:760px"><p class="eyebrow ink">ADMINISTRACIÓN LOCAL</p><h1 style="font-size:56px">Configura la experiencia Costella.</h1><p style="color:var(--muted)">Esta herramienta prepara el archivo <strong>config.js</strong>. En una landing estática, el cambio público se hace subiendo el archivo generado al repositorio.</p><div style="background:var(--paper);padding:30px;margin-top:30px;border:1px solid var(--line);border-radius:12px;display:grid;gap:14px"><label>Booking / calendario<input id="booking" style="width:100%;padding:12px;margin-top:6px" placeholder="https://..." /></label><label>Webinar<input id="webinar" style="width:100%;padding:12px;margin-top:6px" placeholder="https://..." /></label><label>Lead endpoint<input id="lead" style="width:100%;padding:12px;margin-top:6px" placeholder="https://..." /></label><label><input type="checkbox" id="scarcity"> Mostrar cupo del webinar</label><label>Lugares del webinar<input id="slots" type="number" value="10" min="1" style="width:100%;padding:12px;margin-top:6px" /></label><button id="save" class="cta cta-primary" style="width:max-content">Descargar config.js</button><a class="text-link" href="/">Volver a Costella</a></div></main><script>const q=id=>document.getElementById(id);q('save').onclick=()=>{const c=`const COSTELLA_CONFIG = {\n  bookingUrl: ${JSON.stringify(q('booking').value.trim())},\n  webinarUrl: ${JSON.stringify(q('webinar').value.trim())},\n  leadEndpoint: ${JSON.stringify(q('lead').value.trim())},\n  webinarSlots: ${Number(q('slots').value)||10},\n  showWebinarScarcity: ${q('scarcity').checked},\n  metaPixelId: ''\n};\n`;const b=new Blob([c],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='config.js';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
